# FDM_TPU.ini - material overlay (TPU 95A) merged over the base FDM profile at runtime.
# Values approximate the PrusaSlicer generic and Bambu Lab generic filament presets (conservative).
# Flexible filament needs slow, volumetric-limited printing; the PLA-tuned base speeds are capped here
# so print-time estimates are realistic.
filament_type = FLEX
filament_density = 1.22
filament_diameter = 1.75
filament_max_volumetric_speed = 3.2
temperature = 230
first_layer_temperature = 230
bed_temperature = 40
first_layer_bed_temperature = 40
cooling = 1
min_print_speed = 10
slowdown_below_layer_time = 10
fan_below_layer_time = 30
disable_fan_first_layers = 1
min_fan_speed = 50
max_fan_speed = 80
bridge_fan_speed = 80
perimeter_speed = 30
small_perimeter_speed = 20
external_perimeter_speed = 25
infill_speed = 30
solid_infill_speed = 30
top_solid_infill_speed = 20
first_layer_speed = 15
travel_speed = 150
bridge_speed = 20
retract_length = 1.0
retract_speed = 20
