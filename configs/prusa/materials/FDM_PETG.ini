# FDM_PETG.ini - material overlay merged over the base FDM profile at runtime.
# Values approximate the PrusaSlicer generic and Bambu Lab generic filament presets (conservative).
filament_type = PETG
filament_density = 1.27
filament_diameter = 1.75
filament_max_volumetric_speed = 8
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
cooling = 1
min_print_speed = 15
slowdown_below_layer_time = 20
fan_below_layer_time = 20
disable_fan_first_layers = 3
min_fan_speed = 30
max_fan_speed = 50
bridge_fan_speed = 50
