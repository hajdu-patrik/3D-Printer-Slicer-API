# FDM_PLA.ini - material overlay merged over the base FDM profile at runtime.
# Values approximate the PrusaSlicer generic and Bambu Lab generic filament presets (conservative).
filament_type = PLA
filament_density = 1.24
filament_diameter = 1.75
filament_max_volumetric_speed = 15
temperature = 215
first_layer_temperature = 220
bed_temperature = 55
first_layer_bed_temperature = 60
cooling = 1
min_print_speed = 15
slowdown_below_layer_time = 8
fan_below_layer_time = 60
disable_fan_first_layers = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
