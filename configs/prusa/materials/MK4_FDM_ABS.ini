# MK4 material overlay for ABS, merged into MK4_FDM_*.ini runtime profiles.
# Values copied from the official PrusaSlicer 2.8.1 preset "[filament:Generic ABS @MK4]"
# (resources/profiles/PrusaResearch.ini, inheritance resolved; compatible with MK4IS 0.4).
filament_type = ABS
filament_density = 1.04
filament_diameter = 1.75
filament_max_volumetric_speed = 15
temperature = 260
first_layer_temperature = 260
bed_temperature = 110
first_layer_bed_temperature = 100
cooling = 1
min_print_speed = 15
slowdown_below_layer_time = 20
fan_below_layer_time = 30
disable_fan_first_layers = 4
min_fan_speed = 15
max_fan_speed = 15
bridge_fan_speed = 25
