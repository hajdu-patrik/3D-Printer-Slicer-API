# MK4 material overlay for PLA, merged into MK4_FDM_*.ini runtime profiles.
# Values copied from the official PrusaSlicer 2.8.1 preset "[filament:Generic PLA @PGIS]"
# (resources/profiles/PrusaResearch.ini, inheritance resolved; compatible with MK4IS 0.4).
filament_type = PLA
filament_density = 1.24
filament_diameter = 1.75
filament_max_volumetric_speed = 15
temperature = 220
first_layer_temperature = 230
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
min_print_speed = 15
slowdown_below_layer_time = 8
fan_below_layer_time = 100
disable_fan_first_layers = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
