# MK4 material overlay for PETG, merged into MK4_FDM_*.ini runtime profiles.
# Values copied from the official PrusaSlicer 2.8.1 preset "[filament:Generic PETG @PGIS]"
# (resources/profiles/PrusaResearch.ini, inheritance resolved; compatible with MK4IS 0.4).
filament_type = PETG
filament_density = 1.27
filament_diameter = 1.75
filament_max_volumetric_speed = 9
temperature = 245
first_layer_temperature = 240
bed_temperature = 90
first_layer_bed_temperature = 85
cooling = 1
min_print_speed = 15
slowdown_below_layer_time = 9
fan_below_layer_time = 20
disable_fan_first_layers = 3
min_fan_speed = 30
max_fan_speed = 60
bridge_fan_speed = 50
filament_retract_length = 0.8
