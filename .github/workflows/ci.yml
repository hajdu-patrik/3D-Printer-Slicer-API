name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/services/slice.service.js
          node --check app/services/pricing.service.js
          node --check app/docs/swagger-docs.js
          node --check app/routes/pricing.routes.js
          node --check app/routes/slice.routes.js
          node --check app/routes/system.routes.js
          node --check app/middleware/requireAdmin.js
          node --check app/config/constants.js
          node --check app/config/paths.js
          node --check app/utils/logger.js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          python -m py_compile app/cad2stl.py app/mesh2stl.py app/orient.py app/scale_model.py
